services:
  # ── PostgreSQL with pgvector ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-lms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./setup_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      # Host 5433 → container 5432. Host 5432 is often already taken by a
      # native Postgres install. Internal Docker traffic uses postgres:5432
      # over the Docker network, so this mapping is only for host-side psql.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis (cache + rate-limit store + session cache) ─────────────────────
  redis:
    image: redis:7-alpine
    container_name: rag-lms-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"   # loopback only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Backend: FastAPI ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-lms-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database (connect over the docker network, not localhost)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Redis
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE: redis://redis:6379/1
      # Auth + LLM
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      # CORS — allow the frontend container + (optionally) your deployed domain
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
      # Email (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      APP_FROM_NAME: ${APP_FROM_NAME:-Gyanalms}
    volumes:
      - pdf_uploads:/app/fin_ed_docs
      - student_uploads:/app/uploads
      - hf_cache:/models           # persist Hugging Face model cache across rebuilds
    expose:
      - "8000"                      # internal only — nginx proxies to it
    restart: unless-stopped

  # ── Frontend: nginx serving the Vite build + proxying to backend ─────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-lms-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  pdf_uploads:
  student_uploads:
  hf_cache:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#546E7A"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#0277BD"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#2E7D32"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#E65100"/>
    </marker>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="880" height="520" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="440" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a2e">3-Stage Hybrid Retrieval Pipeline</text>
  <line x1="220" y1="47" x2="660" y2="47" stroke="#0277BD" stroke-width="3" stroke-linecap="round"/>

  <!-- ── QUERY INPUT ── -->
  <rect x="320" y="62" width="240" height="50" rx="10" fill="#004D40" filter="url(#sh)"/>
  <text x="440" y="81" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Student Query</text>
  <text x="440" y="100" text-anchor="middle" font-size="10" fill="#80CBC4">"Explain photosynthesis" (English or Nepali)</text>

  <!-- arrow down split -->
  <line x1="350" y1="112" x2="200" y2="160" stroke="#546E7A" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="440" y1="112" x2="440" y2="160" stroke="#546E7A" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="530" y1="112" x2="680" y2="160" stroke="#546E7A" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ════ STAGE 1 ════ -->
  <text x="440" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#546E7A" letter-spacing="1">STAGE 1 — DUAL RETRIEVAL (Top-30 each)</text>

  <!-- BM25 box -->
  <rect x="60" y="162" width="260" height="100" rx="10" fill="#E3F2FD" stroke="#0288D1" stroke-width="2" filter="url(#sh)"/>
  <text x="190" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#01579B">BM25 Keyword Search</text>
  <rect x="80" y="194" width="220" height="24" rx="5" fill="#fff" stroke="#90CAF9" stroke-width="1"/>
  <text x="190" y="211" text-anchor="middle" font-size="9.5" fill="#0D47A1" font-style="italic">plainto_tsquery('simple', query)</text>
  <text x="190" y="237" text-anchor="middle" font-size="9.5" fill="#555">GIN full-text index &bull; ts_rank() scoring</text>
  <text x="190" y="252" text-anchor="middle" font-size="9.5" fill="#555">Term frequency + inverse doc frequency</text>

  <!-- Query Encoder box -->
  <rect x="320" y="162" width="200" height="100" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" filter="url(#sh)"/>
  <text x="420" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#1B5E20">Query Encoder</text>
  <text x="420" y="204" text-anchor="middle" font-size="10" fill="#555">MiniLM-L12</text>
  <text x="420" y="222" text-anchor="middle" font-size="10" fill="#555">50+ languages</text>
  <text x="420" y="244" text-anchor="middle" font-size="26" fill="#388E3C" font-weight="900">↓</text>
  <text x="420" y="262" text-anchor="middle" font-size="9.5" fill="#2E7D32" font-weight="600">384-dim vector</text>

  <!-- Semantic Search box -->
  <rect x="560" y="162" width="260" height="100" rx="10" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" filter="url(#sh)"/>
  <text x="690" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#E65100">Semantic Vector Search</text>
  <rect x="578" y="194" width="224" height="24" rx="5" fill="#fff" stroke="#FFCC80" stroke-width="1"/>
  <text x="690" y="211" text-anchor="middle" font-size="9.5" fill="#BF360C" font-style="italic">1 − (embedding &lt;=&gt; query_vec)</text>
  <text x="690" y="237" text-anchor="middle" font-size="9.5" fill="#555">IVFFlat index (lists=100)</text>
  <text x="690" y="252" text-anchor="middle" font-size="9.5" fill="#555">Cosine similarity &bull; 384-dim space</text>

  <!-- merge arrow -->
  <line x1="190" y1="262" x2="350" y2="308" stroke="#546E7A" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="420" y1="270" x2="420" y2="308" stroke="#546E7A" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="690" y1="262" x2="510" y2="308" stroke="#546E7A" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ════ STAGE 2 ════ -->
  <text x="440" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#546E7A" letter-spacing="1">STAGE 2 — SCORE FUSION &amp; METADATA BOOSTING</text>

  <rect x="190" y="312" width="500" height="80" rx="10" fill="#ECEFF1" stroke="#607D8B" stroke-width="2" filter="url(#sh)"/>
  <text x="440" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">Hybrid Score Fusion</text>
  <!-- formula box -->
  <rect x="210" y="344" width="460" height="28" rx="7" fill="#263238"/>
  <text x="440" y="364" text-anchor="middle" font-size="12" font-weight="600" fill="#80DEEA" font-style="italic">hybrid_score = 0.3 × BM25_norm  +  0.7 × semantic_sim</text>
  <text x="440" y="385" text-anchor="middle" font-size="9.5" fill="#555">Deduplicate &bull; merge 60 candidates &bull; top-30 selected &bull; chapter/section metadata preserved</text>

  <line x1="440" y1="392" x2="440" y2="420" stroke="#546E7A" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ════ STAGE 3 ════ -->
  <text x="440" y="413" text-anchor="middle" font-size="11" font-weight="700" fill="#546E7A" letter-spacing="1">STAGE 3 — CROSS-ENCODER RERANKING</text>

  <rect x="190" y="424" width="500" height="68" rx="10" fill="#EDE7F6" stroke="#7B1FA2" stroke-width="2.5" filter="url(#sh)"/>
  <text x="440" y="445" text-anchor="middle" font-size="12" font-weight="700" fill="#4A148C">mmarco-mMiniLMv2-L12-H384-v1</text>
  <text x="440" y="462" text-anchor="middle" font-size="10" fill="#555">Full query-passage attention &bull; 100+ languages &bull; ~30 passages/sec</text>
  <!-- formula -->
  <rect x="210" y="468" width="460" height="20" rx="5" fill="#4A148C"/>
  <text x="440" y="482" text-anchor="middle" font-size="10.5" font-weight="600" fill="#E1BEE7" font-style="italic">final_score = 0.5 × cross_encoder  +  0.5 × hybrid_score</text>

  <line x1="440" y1="492" x2="440" y2="510" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- Output -->
  <rect x="290" y="506" width="300" height="0" rx="8" fill="#1B5E20"/>
  <!-- nudge output label -->
  <text x="440" y="516" text-anchor="middle" font-size="11" font-weight="700" fill="#1B5E20">Top-5 Chunks → LLM Context</text>
</svg>

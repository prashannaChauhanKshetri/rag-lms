<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="gFrontend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="gBackend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
    <linearGradient id="gData" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="gAI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CE93D8"/>
      <stop offset="100%" stop-color="#7B1FA2"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">System Architecture</text>
  <line x1="300" y1="45" x2="600" y2="45" stroke="#388E3C" stroke-width="3" stroke-linecap="round"/>

  <!-- ════════ PRESENTATION LAYER ════════ -->
  <rect x="40" y="65" width="820" height="120" rx="14" fill="url(#gFrontend)" filter="url(#shadow)"/>
  <text x="450" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">PRESENTATION LAYER</text>
  <text x="450" y="112" text-anchor="middle" font-size="12" fill="#E1F5FE">React 19 &bull; TypeScript &bull; Vite &bull; Tailwind CSS</text>

  <!-- 3 role boxes -->
  <rect x="65" y="125" width="230" height="46" rx="8" fill="#fff" fill-opacity="0.92"/>
  <text x="180" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#0277BD">Admin Portal</text>
  <text x="180" y="160" text-anchor="middle" font-size="9.5" fill="#555">Classes &bull; Teachers &bull; Enrollment</text>

  <rect x="335" y="125" width="230" height="46" rx="8" fill="#fff" fill-opacity="0.92"/>
  <text x="450" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#0277BD">Instructor Portal</text>
  <text x="450" y="160" text-anchor="middle" font-size="9.5" fill="#555">Assignments &bull; Quizzes &bull; Analytics</text>

  <rect x="605" y="125" width="230" height="46" rx="8" fill="#fff" fill-opacity="0.92"/>
  <text x="720" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#0277BD">Student Portal</text>
  <text x="720" y="160" text-anchor="middle" font-size="9.5" fill="#555">AI Chat &bull; Quizzes &bull; Progress</text>

  <!-- Arrow down -->
  <line x1="450" y1="185" x2="450" y2="215" stroke="#546E7A" stroke-width="2.5" marker-end="url(#arrowGrey)"/>
  <text x="530" y="205" font-size="10" fill="#78909C" font-weight="600">REST API + SSE Streaming</text>
  <defs><marker id="arrowGrey" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#546E7A"/></marker></defs>

  <!-- ════════ APPLICATION LAYER ════════ -->
  <rect x="40" y="220" width="820" height="165" rx="14" fill="url(#gBackend)" filter="url(#shadow)"/>
  <text x="450" y="247" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">APPLICATION LAYER</text>
  <text x="450" y="267" text-anchor="middle" font-size="12" fill="#E8F5E9">FastAPI &bull; Python 3.11 &bull; Uvicorn &bull; JWT Auth</text>

  <!-- Service boxes row 1 -->
  <rect x="60" y="280" width="155" height="40" rx="7" fill="#fff" fill-opacity="0.92"/>
  <text x="137" y="304" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2E7D32">Auth Service</text>

  <rect x="230" y="280" width="155" height="40" rx="7" fill="#fff" fill-opacity="0.92"/>
  <text x="307" y="304" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2E7D32">Admin Routes</text>

  <rect x="400" y="280" width="155" height="40" rx="7" fill="#fff" fill-opacity="0.92"/>
  <text x="477" y="304" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2E7D32">Instructor Routes</text>

  <rect x="570" y="280" width="155" height="40" rx="7" fill="#fff" fill-opacity="0.92"/>
  <text x="647" y="304" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2E7D32">Student Routes</text>

  <!-- Service boxes row 2 -->
  <rect x="60" y="333" width="235" height="40" rx="7" fill="#E8F5E9" fill-opacity="0.95" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="177" y="350" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1B5E20">RAG Chat Engine</text>
  <text x="177" y="364" text-anchor="middle" font-size="9" fill="#4CAF50">Hybrid Search + Cross-Encoder + LLM</text>

  <rect x="310" y="333" width="235" height="40" rx="7" fill="#fff" fill-opacity="0.92"/>
  <text x="427" y="350" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2E7D32">PDF Processor</text>
  <text x="427" y="364" text-anchor="middle" font-size="9" fill="#666">TOC &bull; Chunking &bull; OCR &bull; Preeti</text>

  <rect x="560" y="333" width="170" height="40" rx="7" fill="#fff" fill-opacity="0.92"/>
  <text x="645" y="350" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2E7D32">Content Gen</text>
  <text x="645" y="364" text-anchor="middle" font-size="9" fill="#666">Quizzes &bull; Flashcards &bull; Plans</text>

  <!-- Arrow down -->
  <line x1="450" y1="385" x2="450" y2="420" stroke="#546E7A" stroke-width="2.5" marker-end="url(#arrowGrey)"/>

  <!-- ════════ DATA LAYER ════════ -->
  <rect x="40" y="425" width="520" height="130" rx="14" fill="url(#gData)" filter="url(#shadow)"/>
  <text x="300" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">DATA LAYER</text>
  <text x="300" y="472" text-anchor="middle" font-size="12" fill="#FFF3E0">PostgreSQL 17 + pgvector</text>

  <rect x="60" y="485" width="230" height="55" rx="7" fill="#fff" fill-opacity="0.92"/>
  <text x="175" y="505" text-anchor="middle" font-size="10.5" font-weight="600" fill="#E65100">Relational Tables (20+)</text>
  <text x="175" y="520" text-anchor="middle" font-size="9" fill="#666">Users &bull; Assignments &bull; Quizzes</text>
  <text x="175" y="533" text-anchor="middle" font-size="9" fill="#666">Attendance &bull; Enrollment &bull; Grades</text>

  <rect x="310" y="485" width="230" height="55" rx="7" fill="#fff" fill-opacity="0.92"/>
  <text x="425" y="505" text-anchor="middle" font-size="10.5" font-weight="600" fill="#E65100">Vector Store</text>
  <text x="425" y="520" text-anchor="middle" font-size="9" fill="#666">384-dim Embeddings &bull; IVFFlat</text>
  <text x="425" y="533" text-anchor="middle" font-size="9" fill="#666">BM25 GIN Index &bull; JSONB Metadata</text>

  <!-- ════════ EXTERNAL SERVICES ════════ -->
  <rect x="590" y="425" width="270" height="130" rx="14" fill="url(#gAI)" filter="url(#shadow)"/>
  <text x="725" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">EXTERNAL AI</text>

  <rect x="610" y="468" width="230" height="36" rx="7" fill="#fff" fill-opacity="0.92"/>
  <text x="725" y="491" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6A1B9A">Groq API &mdash; Llama 3.3 70B</text>

  <rect x="610" y="512" width="230" height="36" rx="7" fill="#fff" fill-opacity="0.92"/>
  <text x="725" y="528" text-anchor="middle" font-size="10" font-weight="600" fill="#6A1B9A">Sentence-Transformers</text>
  <text x="725" y="542" text-anchor="middle" font-size="9" fill="#888">Multilingual MiniLM &bull; Cross-Encoder</text>

  <!-- Connection lines AI ↔ Backend -->
  <line x1="725" y1="425" x2="725" y2="385" stroke="#9C27B0" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="725" y1="385" x2="560" y2="385" stroke="#9C27B0" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowPurple)"/>
  <defs><marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#9C27B0"/></marker></defs>

  <!-- Legend -->
  <rect x="40" y="580" width="820" height="85" rx="10" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <text x="450" y="600" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Technology Stack</text>
  <text x="140" y="622" text-anchor="middle" font-size="10" fill="#0288D1" font-weight="600">Frontend</text>
  <text x="140" y="638" text-anchor="middle" font-size="9" fill="#555">React 19 &bull; TS &bull; Vite</text>
  <text x="140" y="652" text-anchor="middle" font-size="9" fill="#555">Tailwind &bull; Radix UI</text>

  <text x="320" y="622" text-anchor="middle" font-size="10" fill="#388E3C" font-weight="600">Backend</text>
  <text x="320" y="638" text-anchor="middle" font-size="9" fill="#555">FastAPI &bull; Python 3.11</text>
  <text x="320" y="652" text-anchor="middle" font-size="9" fill="#555">PyJWT &bull; bcrypt</text>

  <text x="500" y="622" text-anchor="middle" font-size="10" fill="#F57C00" font-weight="600">Database</text>
  <text x="500" y="638" text-anchor="middle" font-size="9" fill="#555">PostgreSQL 17 &bull; pgvector</text>
  <text x="500" y="652" text-anchor="middle" font-size="9" fill="#555">IVFFlat &bull; GIN Index</text>

  <text x="680" y="622" text-anchor="middle" font-size="10" fill="#7B1FA2" font-weight="600">AI / ML</text>
  <text x="680" y="638" text-anchor="middle" font-size="9" fill="#555">Llama 3.3 70B &bull; Groq</text>
  <text x="680" y="652" text-anchor="middle" font-size="9" fill="#555">SBERT &bull; Cross-Encoder</text>

  <text x="830" y="622" text-anchor="middle" font-size="10" fill="#D32F2F" font-weight="600">OCR</text>
  <text x="830" y="638" text-anchor="middle" font-size="9" fill="#555">Tesseract 5</text>
  <text x="830" y="652" text-anchor="middle" font-size="9" fill="#555">Docling &bull; PyMuPDF</text>
</svg>

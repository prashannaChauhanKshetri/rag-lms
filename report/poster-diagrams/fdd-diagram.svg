  <line x1="680" y1="240" x2="720" y2="240" stroke="#BCAAA4" stroke-width="1"/>
  <line x1="680" y1="240" x2="680" y2="255" stroke="#BCAAA4" stroke-width="1"/>
  <line x1="720" y1="240" x2="720" y2="255" stroke="#BCAAA4" stroke-width="1"/>
  
  <rect x="655" y="255" width="50" height="24" rx="4" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1"/>
  <text x="680" y="271" text-anchor="middle" font-size="8" fill="#7B1FA2">Llama 3.3</text>
  
  <rect x="695" y="255" width="50" height="24" rx="4" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1"/>
  <text x="720" y="271" text-anchor="middle" font-size="8" fill="#7B1FA2">SSE</text>
  
  <!-- Storage children -->

  <line x1="50" y1="175" x2="200" y2="175" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="50" y1="175" x2="50" y2="190" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="125" y1="175" x2="125" y2="190" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="200" y1="175" x2="200" y2="190" stroke="#8D6E63" stroke-width="1.5"/>
  
  <line x1="375" y1="154" x2="375" y2="175" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="300" y1="175" x2="450" y2="175" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="300" y1="175" x2="300" y2="190" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="375" y1="175" x2="375" y2="190" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="450" y1="175" x2="450" y2="190" stroke="#8D6E63" stroke-width="1.5"/>
  
  <line x1="625" y1="154" x2="625" y2="175" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="550" y1="175" x2="700" y2="175" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="550" y1="175" x2="550" y2="190" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="625" y1="175" x2="625" y2="190" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="700" y1="175" x2="700" y2="190" stroke="#8D6E63" stroke-width="1.5"/>
  
  <line x1="875" y1="154" x2="875" y2="175" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="800" y1="175" x2="950" y2="175" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="800" y1="175" x2="800" y2="190" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="875" y1="175" x2="875" y2="190" stroke="#8D6E63" stroke-width="1.5"/>
  <line x1="950" y1="175" x2="950" y2="190" stroke="#8D6E63" stroke-width="1.5"/>
  

  <rect x="765" y="255" width="70" height="24" rx="4" fill="#E0F7FA" stroke="#80DEEA" stroke-width="1"/>
  <text x="800" y="271" text-anchor="middle" font-size="8" fill="#00838F">pgvector</text>
  
  <line x1="875" y1="220" x2="875" y2="255" stroke="#BCAAA4" stroke-width="1"/>
  <rect x="840" y="255" width="70" height="24" rx="4" fill="#E0F7FA" stroke="#80DEEA" stroke-width="1"/>
  <text x="875" y="271" text-anchor="middle" font-size="8" fill="#00838F">PostgreSQL</text>
  
  <line x1="950" y1="220" x2="950" y2="255" stroke="#BCAAA4" stroke-width="1"/>
  <rect x="915" y="255" width="70" height="24" rx="4" fill="#E0F7FA" stroke="#80DEEA" stroke-width="1"/>
  <text x="950" y="271" text-anchor="middle" font-size="8" fill="#00838F">PDFs/Uploads</text>
  
  <!-- LEVEL 4: Key deeper items -->

  <rect x="165" y="285" width="70" height="22" rx="3" fill="#fff" stroke="#D7CCC8" stroke-width="1"/>
  <text x="200" y="300" text-anchor="middle" font-size="7" fill="#5D4037">Feedback Loop</text>
  
  <!-- Footer -->

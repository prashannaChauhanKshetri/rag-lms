  <line x1="595" y1="240" x2="655" y2="240" stroke="#BCAAA4" stroke-width="1"/>
  <line x1="595" y1="240" x2="595" y2="255" stroke="#BCAAA4" stroke-width="1"/>
  <line x1="625" y1="240" x2="625" y2="255" stroke="#BCAAA4" stroke-width="1"/>
  <line x1="655" y1="240" x2="655" y2="255" stroke="#BCAAA4" stroke-width="1"/>
  
  <rect x="570" y="255" width="50" height="24" rx="4" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="595" y="271" text-anchor="middle" font-size="8" fill="#1565C0">BM25</text>
  
  <rect x="600" y="255" width="50" height="24" rx="4" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="625" y="271" text-anchor="middle" font-size="8" fill="#1565C0">Semantic</text>
  
  <rect x="630" y="255" width="50" height="24" rx="4" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="655" y="271" text-anchor="middle" font-size="8" fill="#1565C0">Reranker</text>
  

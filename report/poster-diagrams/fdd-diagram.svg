  <line x1="575" y1="240" x2="575" y2="255" stroke="#BCAAA4" stroke-width="1"/>
  
  <rect x="495" y="255" width="60" height="24" rx="4" fill="#FCE4EC" stroke="#F48FB1" stroke-width="1"/>
  <text x="525" y="271" text-anchor="middle" font-size="8" fill="#C2185B">Docling</text>
  
  <rect x="545" y="255" width="60" height="24" rx="4" fill="#FCE4EC" stroke="#F48FB1" stroke-width="1"/>
  <text x="575" y="271" text-anchor="middle" font-size="8" fill="#C2185B">Tesseract</text>
  

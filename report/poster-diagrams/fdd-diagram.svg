  <rect x="340" y="240" width="70" height="24" rx="4" fill="#FFF8E1" stroke="#BCAAA4" stroke-width="1"/>
  <text x="375" y="256" text-anchor="middle" font-size="8" fill="#5D4037">Enroll/Assign</text>
  

  <text x="125" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#5D4037">User Interface Layer</text>
  
  <rect x="275" y="120" width="200" height="34" rx="6" fill="#E8D5CE" stroke="#C75B39" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="375" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#5D4037">Application Logic Layer</text>
  
  <rect x="525" y="120" width="200" height="34" rx="6" fill="#E8D5CE" stroke="#C75B39" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="625" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#5D4037">RAG Pipeline Layer</text>
  
  <rect x="775" y="120" width="200" height="34" rx="6" fill="#E8D5CE" stroke="#C75B39" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="875" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#5D4037">Storage Layer</text>
  
  <!-- LEVEL 2 Connectors -->

  <line x1="550" y1="279" x2="550" y2="300" stroke="#D7CCC8" stroke-width="1"/>
  <rect x="510" y="300" width="80" height="22" rx="3" fill="#fff" stroke="#D7CCC8" stroke-width="1"/>
  <text x="550" y="315" text-anchor="middle" font-size="7" fill="#5D4037">Chunker → Embed</text>
  
  <!-- HNSW under pgvector -->
  <line x1="800" y1="279" x2="800" y2="300" stroke="#D7CCC8" stroke-width="1"/>
  <rect x="765" y="300" width="70" height="22" rx="3" fill="#fff" stroke="#D7CCC8" stroke-width="1"/>
  <text x="800" y="315" text-anchor="middle" font-size="7" fill="#5D4037">HNSW Index</text>
  
  <!-- Users/Roles under PostgreSQL -->

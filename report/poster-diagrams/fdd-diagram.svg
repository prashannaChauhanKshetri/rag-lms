<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="1000" height="480" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#C75B39">FUNCTIONAL DECOMPOSITION DIAGRAM (FDD)</text>
  
  <!-- ROOT NODE -->
  <rect x="400" y="50" width="200" height="36" rx="8" fill="#C75B39" filter="url(#shadow)"/>
  <text x="500" y="73" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Gyana RAG-LMS System</text>
  
  <!-- Connector from root to Level 1 -->
  <line x1="500" y1="86" x2="500" y2="105" stroke="#C75B39" stroke-width="2"/>
  <line x1="125" y1="105" x2="875" y2="105" stroke="#C75B39" stroke-width="2"/>
  <line x1="125" y1="105" x2="125" y2="120" stroke="#C75B39" stroke-width="2"/>
  <line x1="375" y1="105" x2="375" y2="120" stroke="#C75B39" stroke-width="2"/>
  <line x1="625" y1="105" x2="625" y2="120" stroke="#C75B39" stroke-width="2"/>
  <line x1="875" y1="105" x2="875" y2="120" stroke="#C75B39" stroke-width="2"/>
  
  <!-- LEVEL 1: Four Main Layers -->

  <rect x="85" y="190" width="80" height="30" rx="5" fill="#fff" stroke="#C75B39" stroke-width="1" filter="url(#shadow)"/>
  <text x="125" y="209" text-anchor="middle" font-size="9" font-weight="500" fill="#5D4037">Instructor Portal</text>
  
  <rect x="160" y="190" width="80" height="30" rx="5" fill="#fff" stroke="#C75B39" stroke-width="1" filter="url(#shadow)"/>
  <text x="200" y="209" text-anchor="middle" font-size="9" font-weight="500" fill="#5D4037">Student Portal</text>
  
  <!-- App Logic Layer -->

  <rect x="840" y="300" width="70" height="22" rx="3" fill="#fff" stroke="#D7CCC8" stroke-width="1"/>
  <text x="875" y="315" text-anchor="middle" font-size="7" fill="#5D4037">Users/Enrolls</text>
  
  <!-- Feedback under AI Chat -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455A64"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0277BD"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="820" fill="#F8FAFC" rx="0"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#1a1a2e">RAG Pipeline — Indexing &amp; Retrieval</text>
  <line x1="240" y1="50" x2="720" y2="50" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>

  <!-- ════════ LEFT COLUMN: INDEXING ════════ -->
  <text x="230" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0277BD" letter-spacing="2">INDEXING PIPELINE</text>
  <rect x="30" y="88" width="400" height="4" rx="2" fill="#0288D1" fill-opacity="0.3"/>

  <!-- Step 1: PDF Upload -->
  <rect x="55" y="108" width="350" height="58" rx="10" fill="#E3F2FD" stroke="#0288D1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="90" cy="137" r="18" fill="#0288D1"/>
  <text x="90" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="270" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#01579B">PDF Upload</text>
  <text x="270" y="149" text-anchor="middle" font-size="10" fill="#555">Nepal CDC textbooks (32+) &bull; English &amp; Nepali</text>

  <line x1="230" y1="166" x2="230" y2="192" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Font Detection -->
  <rect x="55" y="192" width="350" height="72" rx="10" fill="#FFF8E1" stroke="#F9A825" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="90" cy="228" r="18" fill="#F9A825"/>
  <text x="90" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="270" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#E65100">Font Detection</text>
  <text x="270" y="233" text-anchor="middle" font-size="10" fill="#555">Preeti-family fonts detected → Force OCR</text>
  <text x="270" y="249" text-anchor="middle" font-size="10" fill="#555">Standard fonts → PyMuPDF text extraction</text>

  <line x1="230" y1="264" x2="230" y2="290" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Text Extraction -->
  <rect x="55" y="290" width="350" height="88" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="90" cy="334" r="18" fill="#388E3C"/>
  <text x="90" y="339" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="270" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#1B5E20">Text Extraction</text>
  <rect x="115" y="326" width="120" height="26" rx="5" fill="#fff" stroke="#66BB6A" stroke-width="1.2"/>
  <text x="175" y="344" text-anchor="middle" font-size="9.5" fill="#2E7D32">Tesseract OCR</text>
  <rect x="255" y="326" width="130" height="26" rx="5" fill="#fff" stroke="#66BB6A" stroke-width="1.2"/>
  <text x="320" y="344" text-anchor="middle" font-size="9.5" fill="#2E7D32">Docling / PyMuPDF</text>
  <text x="270" y="367" text-anchor="middle" font-size="10" fill="#555">lang=nep+eng &bull; PSM 6 &bull; 300 DPI</text>

  <line x1="230" y1="378" x2="230" y2="404" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: TOC Extraction -->
  <rect x="55" y="404" width="350" height="88" rx="10" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="90" cy="448" r="18" fill="#8E24AA"/>
  <text x="90" y="453" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
  <text x="270" y="424" text-anchor="middle" font-size="12" font-weight="700" fill="#4A148C">TOC Extraction (4-tier fallback)</text>
  <rect x="70" y="435" width="80" height="22" rx="5" fill="#fff" stroke="#CE93D8" stroke-width="1"/>
  <text x="110" y="450" text-anchor="middle" font-size="8.5" fill="#6A1B9A">PyMuPDF</text>
  <rect x="165" y="435" width="80" height="22" rx="5" fill="#fff" stroke="#CE93D8" stroke-width="1"/>
  <text x="205" y="450" text-anchor="middle" font-size="8.5" fill="#6A1B9A">Text Regex</text>
  <rect x="260" y="435" width="68" height="22" rx="5" fill="#fff" stroke="#CE93D8" stroke-width="1"/>
  <text x="294" y="450" text-anchor="middle" font-size="8.5" fill="#6A1B9A">Docling</text>
  <rect x="340" y="435" width="52" height="22" rx="5" fill="#fff" stroke="#CE93D8" stroke-width="1"/>
  <text x="366" y="450" text-anchor="middle" font-size="8.5" fill="#6A1B9A">Groq LLM</text>
  <text x="270" y="479" text-anchor="middle" font-size="10" fill="#555">Page → Chapter mapping for all book types</text>

  <line x1="230" y1="492" x2="230" y2="518" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Chunking -->
  <rect x="55" y="518" width="350" height="88" rx="10" fill="#E8EAF6" stroke="#3949AB" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="90" cy="562" r="18" fill="#3949AB"/>
  <text x="90" y="567" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
  <text x="270" y="538" text-anchor="middle" font-size="12" font-weight="700" fill="#1A237E">Section-Aware Chunking</text>
  <text x="270" y="555" text-anchor="middle" font-size="10" fill="#555">600 tokens / 120 overlap &bull; 19+ section types</text>
  <text x="270" y="571" text-anchor="middle" font-size="10" fill="#555">Exercises &bull; Code &bull; Reading &bull; Glossary</text>
  <text x="270" y="587" text-anchor="middle" font-size="10" fill="#555">Chapter &bull; Page &bull; Heading &bull; Type metadata</text>

  <line x1="230" y1="606" x2="230" y2="632" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Embedding + Storage -->
  <rect x="55" y="632" width="350" height="72" rx="10" fill="#FCE4EC" stroke="#C62828" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="90" cy="668" r="18" fill="#C62828"/>
  <text x="90" y="673" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text>
  <text x="270" y="652" text-anchor="middle" font-size="12" font-weight="700" fill="#B71C1C">Embedding + Storage</text>
  <text x="270" y="669" text-anchor="middle" font-size="10" fill="#555">paraphrase-multilingual-MiniLM &bull; 384-dim</text>
  <text x="270" y="686" text-anchor="middle" font-size="10" fill="#555">pgvector IVFFlat &bull; GIN full-text index</text>


  <!-- ════════ RIGHT COLUMN: RETRIEVAL ════════ -->
  <text x="730" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#388E3C" letter-spacing="2">RETRIEVAL PIPELINE</text>
  <rect x="530" y="88" width="400" height="4" rx="2" fill="#388E3C" fill-opacity="0.3"/>

  <!-- Step A: Student Query -->
  <rect x="555" y="108" width="350" height="58" rx="10" fill="#E0F2F1" stroke="#00796B" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="590" cy="137" r="18" fill="#00796B"/>
  <text x="590" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">A</text>
  <text x="770" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#004D40">Student Query</text>
  <text x="770" y="149" text-anchor="middle" font-size="10" fill="#555">Natural language in English or Nepali</text>

  <line x1="730" y1="166" x2="730" y2="192" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Step B: Query Encoding -->
  <rect x="555" y="192" width="350" height="58" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="590" cy="221" r="18" fill="#388E3C"/>
  <text x="590" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">B</text>
  <text x="770" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#1B5E20">Query Encoding</text>
  <text x="770" y="233" text-anchor="middle" font-size="10" fill="#555">Multilingual MiniLM → 384-dim vector</text>

  <line x1="730" y1="250" x2="730" y2="290" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Step C: Hybrid Search -->
  <rect x="555" y="290" width="350" height="115" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="590" cy="347" r="18" fill="#1565C0"/>
  <text x="590" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">C</text>
  <text x="770" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#0D47A1">Hybrid Search (PostgreSQL)</text>
  <!-- BM25 box -->
  <rect x="575" y="322" width="140" height="36" rx="7" fill="#fff" stroke="#42A5F5" stroke-width="1.5"/>
  <text x="645" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#1565C0">BM25 Keyword</text>
  <text x="645" y="351" text-anchor="middle" font-size="9" fill="#555">plainto_tsquery</text>
  <!-- Semantic box -->
  <rect x="730" y="322" width="155" height="36" rx="7" fill="#fff" stroke="#42A5F5" stroke-width="1.5"/>
  <text x="807" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#1565C0">Semantic Vector</text>
  <text x="807" y="351" text-anchor="middle" font-size="9" fill="#555">cosine similarity</text>
  <!-- Score line -->
  <text x="770" y="383" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0D47A1">Score = 0.3 × BM25  +  0.7 × Semantic</text>
  <text x="770" y="399" text-anchor="middle" font-size="9.5" fill="#555">Top 30 candidates merged &amp; deduplicated</text>

  <line x1="730" y1="405" x2="730" y2="432" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Step D: Cross-Encoder Reranking -->
  <rect x="555" y="432" width="350" height="88" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="590" cy="476" r="18" fill="#E65100"/>
  <text x="590" y="481" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">D</text>
  <text x="770" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#BF360C">Cross-Encoder Reranking</text>
  <text x="770" y="469" text-anchor="middle" font-size="10" fill="#555">mmarco-mMiniLMv2-L12-H384-v1</text>
  <text x="770" y="485" text-anchor="middle" font-size="10" fill="#555">100+ languages incl. Nepali</text>
  <text x="770" y="502" text-anchor="middle" font-size="10.5" font-weight="700" fill="#BF360C">Final = 0.5 × CrossEncoder + 0.5 × Hybrid</text>

  <line x1="730" y1="520" x2="730" y2="546" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Step E: Context Building -->
  <rect x="555" y="546" width="350" height="58" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="590" cy="575" r="18" fill="#388E3C"/>
  <text x="590" y="580" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">E</text>
  <text x="770" y="568" text-anchor="middle" font-size="12" font-weight="700" fill="#1B5E20">Context Building (Top-5)</text>
  <text x="770" y="587" text-anchor="middle" font-size="10" fill="#555">Chapter &bull; Heading &bull; Section type &bull; Page</text>

  <line x1="730" y1="604" x2="730" y2="632" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Step F: LLM Response -->
  <rect x="555" y="632" width="350" height="72" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="590" cy="668" r="18" fill="#6A1B9A"/>
  <text x="590" y="673" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">F</text>
  <text x="770" y="652" text-anchor="middle" font-size="12" font-weight="700" fill="#4A148C">Llama 3.3 70B (Groq LPU)</text>
  <text x="770" y="669" text-anchor="middle" font-size="10" fill="#555">Grounded answer + page citations</text>
  <text x="770" y="686" text-anchor="middle" font-size="10" fill="#555">Streaming via SSE &bull; MMLU ~85%</text>

  <!-- ════════ CENTER CONNECTOR ════════ -->
  <!-- DB icon in center linking indexing to retrieval -->
  <rect x="420" y="610" width="120" height="60" rx="10" fill="#37474F" filter="url(#shadow)"/>
  <text x="480" y="632" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">PostgreSQL 17</text>
  <text x="480" y="648" text-anchor="middle" font-size="9" fill="#B0BEC5">pgvector + BM25</text>
  <text x="480" y="661" text-anchor="middle" font-size="9" fill="#B0BEC5">384-dim IVFFlat</text>

  <line x1="405" y1="668" x2="420" y2="651" stroke="#C62828" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="555" y1="561" x2="540" y2="645" stroke="#1565C0" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <line x1="540" y1="645" x2="555" y2="645" stroke="#1565C0" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Bottom caption -->
  <rect x="30" y="730" width="900" height="68" rx="10" fill="#263238" filter="url(#shadow)"/>
  <text x="480" y="752" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Key Metrics</text>
  <text x="140" y="772" text-anchor="middle" font-size="10" fill="#B0BEC5">Vector Search: &lt;10ms</text>
  <text x="140" y="787" text-anchor="middle" font-size="10" fill="#80CBC4">K=10 candidates</text>
  <text x="310" y="772" text-anchor="middle" font-size="10" fill="#B0BEC5">OCR Accuracy: 96–99%</text>
  <text x="310" y="787" text-anchor="middle" font-size="10" fill="#80CBC4">nep+eng &bull; PSM 6</text>
  <text x="480" y="772" text-anchor="middle" font-size="10" fill="#B0BEC5">Retrieval Accuracy: 94%</text>
  <text x="480" y="787" text-anchor="middle" font-size="10" fill="#80CBC4">31/33 test questions</text>
  <text x="650" y="772" text-anchor="middle" font-size="10" fill="#B0BEC5">LLM Response: 2–3 sec</text>
  <text x="650" y="787" text-anchor="middle" font-size="10" fill="#80CBC4">Streaming SSE</text>
  <text x="820" y="772" text-anchor="middle" font-size="10" fill="#B0BEC5">Embeddings: 384-dim</text>
  <text x="820" y="787" text-anchor="middle" font-size="10" fill="#80CBC4">50+ languages</text>
</svg>

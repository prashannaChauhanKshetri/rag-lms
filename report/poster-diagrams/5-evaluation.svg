<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.12"/></filter>
    <linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="barOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CE93D8"/>
      <stop offset="100%" stop-color="#6A1B9A"/>
    </linearGradient>
    <linearGradient id="barTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4DD0E1"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
  </defs>

  <rect width="900" height="620" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a2e">RAG System Evaluation Results</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#666">RAGAS Framework • 65 Test Questions • 3 Subject Areas</text>
  <line x1="180" y1="62" x2="720" y2="62" stroke="#1B5E20" stroke-width="3" stroke-linecap="round"/>

  <!-- ════ LEFT PANEL: Detailed Results Table ════ -->
  <rect x="20" y="78" width="520" height="280" rx="12" fill="#fff" stroke="#E0E0E0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="280" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#263238">Evaluation Results by Subject</text>

  <!-- Table Header -->
  <rect x="35" y="115" width="490" height="28" rx="4" fill="#263238"/>
  <text x="100" y="133" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Subject</text>
  <text x="185" y="133" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Faithfulness</text>
  <text x="270" y="133" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Relevancy</text>
  <text x="355" y="133" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Precision</text>
  <text x="430" y="133" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Recall</text>
  <text x="495" y="133" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">RAGAS</text>

  <!-- Row 1: Mathematics Grade 10 -->
  <rect x="35" y="148" width="490" height="36" rx="0" fill="#E8F5E9"/>
  <text x="100" y="163" text-anchor="middle" font-size="10" font-weight="600" fill="#1B5E20">Mathematics</text>
  <text x="100" y="177" text-anchor="middle" font-size="8" fill="#388E3C">Grade 10 (n=25)</text>
  <text x="185" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">50.1%</text>
  <text x="270" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">69.0%</text>
  <text x="355" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1B5E20">97.1%</text>
  <text x="430" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">60.2%</text>
  <rect x="470" y="157" width="50" height="22" rx="4" fill="#1B5E20"/>
  <text x="495" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">69.1%</text>

  <!-- Row 2: English Grade 5 -->
  <rect x="35" y="188" width="490" height="36" rx="0" fill="#E3F2FD"/>
  <text x="100" y="203" text-anchor="middle" font-size="10" font-weight="600" fill="#0D47A1">English</text>
  <text x="100" y="217" text-anchor="middle" font-size="8" fill="#1565C0">Grade 5 (n=25)</text>
  <text x="185" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#1565C0">53.6%</text>
  <text x="270" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#1565C0">64.5%</text>
  <text x="355" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#0D47A1">95.5%</text>
  <text x="430" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#1565C0">52.0%</text>
  <rect x="470" y="197" width="50" height="22" rx="4" fill="#0D47A1"/>
  <text x="495" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">66.4%</text>

  <!-- Row 3: Social Studies (Nepali) -->
  <rect x="35" y="228" width="490" height="36" rx="0" fill="#F3E5F5"/>
  <text x="100" y="243" text-anchor="middle" font-size="10" font-weight="600" fill="#6A1B9A">Social Studies</text>
  <text x="100" y="257" text-anchor="middle" font-size="8" fill="#7B1FA2">Grade 7 Nepali (n=15)</text>
  <text x="185" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#7B1FA2">52.9%</text>
  <text x="270" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#7B1FA2">52.3%</text>
  <text x="355" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#6A1B9A">82.3%</text>
  <text x="430" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#7B1FA2">45.1%</text>
  <rect x="470" y="237" width="50" height="22" rx="4" fill="#6A1B9A"/>
  <text x="495" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">58.1%</text>

  <!-- Average Row -->
  <rect x="35" y="272" width="490" height="32" rx="0" fill="#ECEFF1"/>
  <text x="100" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#37474F">Average (n=65)</text>
  <text x="185" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#37474F">52.2%</text>
  <text x="270" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#37474F">62.0%</text>
  <text x="355" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">91.6%</text>
  <text x="430" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#37474F">52.4%</text>
  <rect x="470" y="279" width="50" height="22" rx="4" fill="#263238"/>
  <text x="495" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#4DD0E1">64.5%</text>

  <!-- Key Findings -->
  <text x="280" y="325" text-anchor="middle" font-size="10" font-weight="600" fill="#455A64">Key Findings:</text>
  <text x="280" y="342" text-anchor="middle" font-size="9" fill="#607D8B">• Context Precision 91.6% — retrieval accurately finds relevant content</text>
  <text x="280" y="355" text-anchor="middle" font-size="9" fill="#607D8B">• Math template improves structured answers by +25 RAGAS points</text>

  <!-- ════ RIGHT PANEL: RAGAS Metrics Explained ════ -->
  <rect x="560" y="78" width="320" height="280" rx="12" fill="#fff" stroke="#E0E0E0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="720" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#263238">RAGAS Metrics Explained</text>

  <!-- Metric 1: Faithfulness -->
  <rect x="575" y="118" width="290" height="48" rx="6" fill="#E8F5E9" stroke="#A5D6A7"/>
  <text x="590" y="138" font-size="11" font-weight="700" fill="#1B5E20">Faithfulness</text>
  <text x="590" y="154" font-size="9" fill="#388E3C">Measures if answer is grounded in retrieved context.</text>
  <text x="840" y="142" text-anchor="end" font-size="14" font-weight="700" fill="#1B5E20">52%</text>

  <!-- Metric 2: Answer Relevancy -->
  <rect x="575" y="172" width="290" height="48" rx="6" fill="#E3F2FD" stroke="#90CAF9"/>
  <text x="590" y="192" font-size="11" font-weight="700" fill="#0D47A1">Answer Relevancy</text>
  <text x="590" y="208" font-size="9" fill="#1565C0">Measures if answer addresses the question asked.</text>
  <text x="840" y="196" text-anchor="end" font-size="14" font-weight="700" fill="#0D47A1">62%</text>

  <!-- Metric 3: Context Precision -->
  <rect x="575" y="226" width="290" height="48" rx="6" fill="#FFF3E0" stroke="#FFCC80"/>
  <text x="590" y="246" font-size="11" font-weight="700" fill="#E65100">Context Precision</text>
  <text x="590" y="262" font-size="9" fill="#F57C00">Measures if relevant docs are ranked higher (DCG).</text>
  <text x="840" y="250" text-anchor="end" font-size="14" font-weight="700" fill="#E65100">92%</text>

  <!-- Metric 4: Context Recall -->
  <rect x="575" y="280" width="290" height="48" rx="6" fill="#F3E5F5" stroke="#CE93D8"/>
  <text x="590" y="300" font-size="11" font-weight="700" fill="#6A1B9A">Context Recall</text>
  <text x="590" y="316" font-size="9" fill="#7B1FA2">Measures if context covers required information.</text>
  <text x="840" y="304" text-anchor="end" font-size="14" font-weight="700" fill="#6A1B9A">52%</text>

  <!-- Formula -->
  <text x="720" y="348" text-anchor="middle" font-size="9" fill="#78909C">RAGAS = (F + AR + CP + CR) / 4</text>

  <!-- ════ BOTTOM LEFT: Math Template Impact ════ -->
  <rect x="20" y="378" width="280" height="115" rx="12" fill="#263238" filter="url(#sh)"/>
  <text x="160" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Math Template Improvement</text>
  
  <!-- Before/After -->
  <text x="90" y="432" text-anchor="middle" font-size="9" fill="#90A4AE">Before</text>
  <text x="90" y="455" text-anchor="middle" font-size="22" font-weight="900" fill="#EF5350">44%</text>
  <text x="90" y="472" text-anchor="middle" font-size="8" fill="#78909C">Generic template</text>

  <text x="160" y="450" text-anchor="middle" font-size="20" fill="#4DD0E1">→</text>

  <text x="230" y="432" text-anchor="middle" font-size="9" fill="#90A4AE">After</text>
  <text x="230" y="455" text-anchor="middle" font-size="22" font-weight="900" fill="#66BB6A">69%</text>
  <text x="230" y="472" text-anchor="middle" font-size="8" fill="#78909C">Specialized math</text>

  <rect x="115" y="480" width="90" height="8" rx="4" fill="#1B5E20"/>
  <text x="160" y="500" text-anchor="middle" font-size="9" font-weight="600" fill="#A5D6A7">+25 points</text>

  <!-- ════ BOTTOM CENTER: Retrieval Performance ════ -->
  <rect x="315" y="378" width="270" height="115" rx="12" fill="#fff" stroke="#E0E0E0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="450" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">Retrieval Performance</text>

  <!-- Stats -->
  <text x="370" y="435" text-anchor="middle" font-size="24" font-weight="900" fill="#0D47A1">426ms</text>
  <text x="370" y="452" text-anchor="middle" font-size="9" fill="#607D8B">Avg Retrieval</text>
  <text x="370" y="465" text-anchor="middle" font-size="8" fill="#90A4AE">Hybrid + Rerank</text>

  <line x1="420" y1="420" x2="420" y2="475" stroke="#E0E0E0" stroke-width="1"/>

  <text x="530" y="435" text-anchor="middle" font-size="24" font-weight="900" fill="#E65100">6.5s</text>
  <text x="530" y="452" text-anchor="middle" font-size="9" fill="#607D8B">Avg LLM</text>
  <text x="530" y="465" text-anchor="middle" font-size="8" fill="#90A4AE">Llama 3.3 70B</text>

  <text x="450" y="485" text-anchor="middle" font-size="9" fill="#78909C">Total: ~7s per question (Groq API)</text>

  <!-- ════ BOTTOM RIGHT: Test Coverage ════ -->
  <rect x="600" y="378" width="280" height="115" rx="12" fill="#263238" filter="url(#sh)"/>
  <text x="740" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Test Coverage</text>

  <!-- Stats Row 1 -->
  <text x="660" y="435" text-anchor="middle" font-size="22" font-weight="900" fill="#4DD0E1">65</text>
  <text x="660" y="452" text-anchor="middle" font-size="9" fill="#B0BEC5">Questions</text>

  <text x="740" y="435" text-anchor="middle" font-size="22" font-weight="900" fill="#A5D6A7">3</text>
  <text x="740" y="452" text-anchor="middle" font-size="9" fill="#B0BEC5">Subjects</text>

  <text x="820" y="435" text-anchor="middle" font-size="22" font-weight="900" fill="#FFE082">2</text>
  <text x="820" y="452" text-anchor="middle" font-size="9" fill="#B0BEC5">Languages</text>

  <!-- Subject breakdown -->
  <text x="740" y="475" text-anchor="middle" font-size="8" fill="#78909C">Math (25) • English (25) • Social Studies (15)</text>
  <text x="740" y="488" text-anchor="middle" font-size="8" fill="#78909C">English + Nepali (Devanagari via OCR)</text>

  <!-- ════ Footer ════ -->
  <text x="450" y="510" text-anchor="middle" font-size="9" fill="#78909C">Embedding: paraphrase-multilingual-MiniLM-L12-v2 (384 dim) • Reranker: mmarco-mMiniLMv2-L12-H384-v1 • LLM: Llama 3.3 70B via Groq</text>

  <!-- Overall Score Badge -->
  <rect x="380" y="528" width="140" height="40" rx="8" fill="#1B5E20" filter="url(#sh)"/>
  <text x="450" y="550" text-anchor="middle" font-size="11" fill="#A5D6A7">Overall RAGAS</text>
  <text x="450" y="564" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">64.5%</text>

  <!-- Methodology note -->
  <text x="450" y="590" text-anchor="middle" font-size="8" fill="#90A4AE">Evaluated using RAGAS framework with embedding-based similarity scoring • Nepal CDC Curriculum Textbooks</text>
</svg>

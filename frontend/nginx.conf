server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large PDF uploads
    client_max_body_size 50M;

    # Proxy /api/* to the backend, stripping the /api prefix
    # (mirrors the Vite dev proxy so frontend code paths work in both envs)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Direct-path backend routes (used when the frontend calls non-/api paths)
    location ~ ^/(auth|chatbots|admin|super-admin|instructor|student|notifications|feedback|uploads|static|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback — all other routes serve index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache static assets (Vite hashes filenames so invalidation is safe)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
